[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=1.22"]
build-backend = "scikit_build_core.build"

[project]
name = "FPLUS"
version = "0.5.0"
description = "Sparse LU with partial (supernodal), rook and full pivoting, int64 indices; a C library with a Python interface"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[tool.scikit-build]
# CMake installs the package (the extension and the Python files) itself
wheel.packages = []
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
FPLUS_BUILD_PYTHON = "ON"
FPLUS_BUILD_TESTS = "OFF"
FPLUS_BUILD_EXAMPLES = "OFF"
